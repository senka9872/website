<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Твій результат — ЕннеаСвіт</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header class="header">

    <a href="index.html" class="logo">
        Еннеа<span>Світ</span>
    </a>

    <nav class="navigation">

        <a href="index.html">
            Головна
        </a>

        <a href="test.html">
            Пройти тест ще раз
        </a>

    </nav>

    <button id="themeButton"
            class="theme-button">
        🌙
    </button>

</header>


<main class="result-page">

    <div class="result-container">

        <p class="section-label">
            ТВОЄ РОЗУМІННЯ СЕБЕ
        </p>


        <h1>
            Результат тесту
        </h1>


        <div class="main-result">

            <div class="result-number"
                 id="mainNumber">
                9
            </div>


            <p class="result-label">
                Твій найбільш імовірний тип
            </p>


            <h2 id="mainType">
                Миротворець
            </h2>


            <p id="mainDescription">
                Завантаження...
            </p>

        </div>


        <h2 class="other-title">
            Інші можливі типи
        </h2>


        <div class="other-results">

            <div class="other-card">

                <span id="secondNumber">
                    4
                </span>

                <h3 id="secondType">
                    Індивідуаліст
                </h3>

            </div>


            <div class="other-card">

                <span id="thirdNumber">
                    6
                </span>

                <h3 id="thirdType">
                    Скептик
                </h3>

            </div>

        </div>


        <div class="result-buttons">

            <a href="test.html"
               class="main-button">

                Пройти ще раз

            </a>


            <a href="index.html"
               class="secondary-button">

                На головну

            </a>

        </div>

    </div>

</main>


<script src="js/main.js"></script>
<script src="js/result.js"></script>

</body>
</html>
